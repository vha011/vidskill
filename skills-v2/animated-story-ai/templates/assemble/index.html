<!doctype html>
<html><head><meta charset="utf-8"><script src="assets/gsap.min.js"></script>
<style>html,body{margin:0;width:1920px;height:1080px;background:#000;overflow:hidden}#root{position:relative;width:1920px;height:1080px}video{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover}</style></head><body>
<div id="root" data-composition-id="root" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<!-- Mẫu đã lint + render: clip tắt tiếng nối tiếp trên track 0, âm thanh là thẻ <audio> riêng. Thay a.mp4, b.mp4, bgm.m4a bằng file thật. -->
<video id="v1" class="clip" src="assets/a.mp4" muted playsinline data-start="0" data-duration="3" data-track-index="0"></video>
<video id="v2" class="clip" src="assets/b.mp4" muted playsinline data-start="3" data-duration="3" data-track-index="0"></video>
<audio id="au" src="assets/bgm.m4a" data-start="0" data-duration="6" data-track-index="5" data-volume="1"></audio>
</div>
<script>const tl=gsap.timeline({paused:true});tl.from("#v2",{opacity:0,duration:.2},3);window.__timelines=window.__timelines||{};window.__timelines["root"]=tl;</script></body></html>
